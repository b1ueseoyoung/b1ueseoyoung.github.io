<body>
  <canvas id="game" aria-label="게임 화면"></canvas>

  <!-- 표지: 책상 위 양장본 -->
  <section id="cover" class="screen desk" aria-labelledby="coverTitle">
    <div class="book3d">
      <div class="hardcover">
        <div class="hc-front">
          <img class="cover-art" src="assets/images/backgrounds/cover.webp" width="1280" height="720" alt="아이 방 책장 뒤에서 노란 도깨비 부기가 한입 베어 문 그림책을 들고 엿보는 그림책 표지" />
          <p class="cover-kicker">문장이 무기가 되는 그림책 뱀서류</p>
          <h1 class="cover-title" id="coverTitle"><span class="cover-name" id="coverName">서영</span><span id="coverJosa">이와</span><br />책 먹는 부기</h1>
          <label class="name-tag"><span>주인공 이름</span><input id="nameInput" maxlength="5" value="서영" autocomplete="off" spellcheck="false" aria-label="주인공 이름(한글 1~5자)" /></label>
          <p class="boogie-say" id="coverSay" hidden></p>
        </div>
        <div class="hc-side"></div>
        <div class="hc-foot"></div>
        <nav class="index-tabs" aria-label="메뉴">
          <button class="tab" type="button" data-open="howto">놀이 방법</button>
          <button class="tab" type="button" data-open="market">도깨비 시장</button>
          <button class="tab" type="button" data-open="wordbook">단어장</button>
          <button class="tab" type="button" data-open="shelf">책장</button>
          <button class="tab" type="button" data-open="storybook">부기 이야기</button>
        </nav>
        <button class="start-ribbon" id="startBtn" type="button"><span id="startLabel">밤 시작하기 <kbd>Enter</kbd></span></button>
      </div>
    </div>
    <p class="cover-foot" id="coverMeta"></p>
    <a class="back" href="../">← 포트폴리오로</a>
  </section>

  <!-- 펼친 책 화면들: JS가 .page 안을 채운다 -->
  <section id="prologue" class="screen overlay" hidden aria-label="이야기의 시작">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="howto" class="screen overlay" hidden aria-label="놀이 방법">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="wager" class="screen overlay" hidden aria-label="내기 고르기">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="pause" class="screen overlay" hidden aria-label="일시정지">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
  </section>
  <section id="result" class="screen overlay bookresult" hidden aria-label="오늘 밤 그림책">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="market" class="screen overlay" hidden aria-label="도깨비 시장">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="wordbook" class="screen overlay" hidden aria-label="단어장">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="shelf" class="screen overlay" hidden aria-label="책장">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="storybook" class="screen overlay" hidden aria-label="부기 이야기">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>
  <section id="ending" class="screen overlay ending" hidden aria-label="엔딩">
    <div class="spread"><div class="page page-l"></div><div class="page page-r"></div></div>
    <div class="spread-actions"></div>
  </section>

  <!-- 레벨업: 낱말 카드 -->
  <section id="levelup" class="screen overlay" hidden aria-labelledby="levelupTitle">
    <h2 class="paper-title" id="levelupTitle">낱말을 골라요</h2>
    <div class="word-cards"></div>
    <p class="lv-foot"><span>1·2·3 키 또는 눌러서 고르기</span><button class="btn sm" id="rerollBtn" type="button" hidden></button></p>
  </section>

  <!-- 게임 중 HUD -->
  <div id="hud" class="hud" hidden>
    <div class="xp"><i></i></div>
    <div class="hud-top">
      <div class="hearts" role="img" aria-label="체력"></div>
      <div class="hud-center">
        <span class="hud-kicker">오늘 밤 그림책</span>
        <div class="adverbs"></div>
        <ol class="lines" aria-label="오늘 밤 그림책 문장"></ol>
      </div>
      <div class="hud-right">
        <div class="hud-stat"><span class="timer">0:00</span><span class="lv">Lv 1</span></div>
        <button class="pause-btn" id="pauseBtn" type="button" aria-label="일시정지 (Esc)"><i></i><kbd>Esc</kbd></button>
      </div>
    </div>
    <div class="boss-bar" hidden><div class="boss-name"></div><div class="rope"><i></i></div></div>
    <div class="boogie-bubble" hidden><span class="face"><img src="assets/images/characters/boogie-portrait.webp" alt="" /></span><p></p></div>
    <p class="hint-toast" hidden></p>
    <button class="ttuk-btn" id="ttukBtn" type="button" aria-label="뚝딱 (Space)"><span>뚝딱<kbd>Space</kbd></span></button>
  </div>

  <div id="joy" hidden><i></i></div>
  <pre id="debug" hidden></pre>

  <script>window.__ASSETS = ["assets/images/backgrounds/cover.webp","assets/images/backgrounds/og.jpg","assets/images/characters/boogie-dizzy.webp","assets/images/characters/boogie-hurt.webp","assets/images/characters/boogie-portrait.webp","assets/images/characters/player-child.webp","assets/images/enemies/boss-big-millstone-hurt.webp","assets/images/enemies/elite-big-broom.webp","assets/images/enemies/elite-millstone.webp","assets/images/enemies/enemy-broom.webp","assets/images/enemies/enemy-dokkaebibul.webp","assets/images/enemies/enemy-gomusin.webp","assets/images/enemies/enemy-patjuk.webp","assets/images/enemies/enemy-poker.webp","assets/images/enemies/enemy-yeot.webp","assets/images/story/ending-bitter.webp","assets/images/story/ending-true.webp","assets/images/story/page-1.webp","assets/images/story/page-2.webp","assets/images/story/page-3.webp","assets/images/story/page-4.webp","assets/images/story/page-5.webp","assets/images/story/page-6.webp","assets/images/story/prologue-1.webp","assets/images/story/prologue-2.webp","assets/images/story/prologue-3.webp","assets/images/ui/favicon.png"];</script>
  <script type="module" src="./game.js"></script>
</body>
</html>
